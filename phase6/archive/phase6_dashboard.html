<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 6 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .section-card { transition: all 0.2s ease; }
        .metric-value { font-variant-numeric: tabular-nums; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-7xl mx-auto p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight">Phase 6 Dashboard</h1>
                <div class="flex items-center gap-3 mt-1">
                    <span id="mode-badge" class="px-3 py-0.5 text-xs rounded-2xl bg-emerald-900 text-emerald-400 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-circle text-[8px]"></i> <span id="mode-text">PAPER</span>
                    </span>
                    <span class="text-slate-500 text-sm">Last updated: <span id="last-updated">--</span></span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-400">Total Portfolio Value</div>
                <div id="total-balance" class="text-4xl font-semibold tabular-nums">$0.00</div>
                <div id="balance-source" class="text-xs text-slate-500"></div>
            </div>
        </div>

        <!-- KPI Row -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 section-card">
                <div class="text-slate-400 text-sm">Today</div>
                <div id="pnl-today" class="text-2xl font-semibold mt-1 metric-value">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 section-card">
                <div class="text-slate-400 text-sm">24 Hours</div>
                <div id="pnl-24h" class="text-2xl font-semibold mt-1 metric-value">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 section-card">
                <div class="text-slate-400 text-sm">7 Days</div>
                <div id="pnl-7d" class="text-2xl font-semibold mt-1 metric-value">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 section-card">
                <div class="text-slate-400 text-sm">30 Days</div>
                <div id="pnl-30d" class="text-2xl font-semibold mt-1 metric-value">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 section-card">
                <div class="text-slate-400 text-sm">Win Ratio</div>
                <div id="win-ratio" class="text-2xl font-semibold mt-1 metric-value">--</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Active Positions -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6 section-card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold flex items-center gap-2"><i class="fa-solid fa-wallet"></i> Active Positions</h2>
                    <span id="position-count" class="text-xs px-3 py-1 bg-slate-800 rounded-2xl">0 pairs</span>
                </div>
                <div id="positions-table" class="overflow-auto min-h-[120px]"></div>
            </div>

            <!-- Sentiment -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 section-card">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-globe"></i> Sentiment</h2>
                <div id="sentiment-grid" class="grid grid-cols-2 gap-3 text-sm"></div>
            </div>

            <!-- Recent Rebalances -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 section-card">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-sync"></i> Recent Rebalances</h2>
                <div id="rebalances-list" class="space-y-3 text-sm min-h-[80px]"></div>
            </div>

            <!-- Recent Trades -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 section-card">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-exchange-alt"></i> Recent Trades</h2>
                <div id="trades-list" class="space-y-3 text-sm min-h-[80px]"></div>
            </div>
        </div>
    </div>

    <script>
        // Tailwind script config
        function initTailwind() {
            document.documentElement.style.setProperty('--accent', '#10b981');
        }

        async function fetchData(endpoint) {
            try {
                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('Network error');
                return await res.json();
            } catch (e) {
                console.error('Fetch error for ' + endpoint, e);
                return null;
            }
        }

        function updateModeBadge(mode) {
            const badge = document.getElementById('mode-badge');
            const text = document.getElementById('mode-text');
            if (!badge || !text) return;
            
            if (mode === 'live') {
                badge.className = 'px-3 py-0.5 text-xs rounded-2xl bg-red-900 text-red-400 font-medium flex items-center gap-1.5';
                text.textContent = 'LIVE';
                badge.querySelector('i').className = 'fa-solid fa-circle text-[8px] text-red-400';
            } else {
                badge.className = 'px-3 py-0.5 text-xs rounded-2xl bg-emerald-900 text-emerald-400 font-medium flex items-center gap-1.5';
                text.textContent = 'PAPER';
                badge.querySelector('i').className = 'fa-solid fa-circle text-[8px]';
            }
        }

        function updateTimestamp() {
            const el = document.getElementById('last-updated');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        function renderPositions(data) {
            const container = document.getElementById('positions-table');
            const countEl = document.getElementById('position-count');
            if (!container) return;

            const positions = data?.positions || [];
            if (countEl) countEl.textContent = `${positions.length} pairs`;

            if (!positions.length) {
                container.innerHTML = `<div class="text-slate-500 text-sm py-4">No active positions</div>`;
                return;
            }

            let html = `<table class="w-full text-sm"><thead><tr class="text-slate-400 border-b border-slate-800">`;
            html += `<th class="text-left py-2 font-normal">Pair</th>`;
            html += `<th class="text-right py-2 font-normal">Entry</th>`;
            html += `<th class="text-right py-2 font-normal">PnL</th>`;
            html += `</tr></thead><tbody>`;

            positions.forEach(pos => {
                const pair = pos.pair || pos.currency || 'N/A';
                const entry = pos.entry_price ? `$${parseFloat(pos.entry_price).toFixed(2)}` : (pos.balance ? pos.balance.toFixed(4) : '-');
                const pnl = pos.pnl !== undefined ? `${parseFloat(pos.pnl).toFixed(2)}%` : '-';
                const pnlClass = pos.pnl && parseFloat(pos.pnl) >= 0 ? 'text-emerald-400' : 'text-red-400';
                
                html += `<tr class="border-b border-slate-800 last:border-0">`;
                html += `<td class="py-2.5 font-medium">${pair}</td>`;
                html += `<td class="py-2.5 text-right tabular-nums">${entry}</td>`;
                html += `<td class="py-2.5 text-right tabular-nums ${pnlClass}">${pnl}</td>`;
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderBalance(data) {
            const totalEl = document.getElementById('total-balance');
            const sourceEl = document.getElementById('balance-source');
            
            if (totalEl) {
                const bal = data?.total_balance || data?.balances?.reduce((sum, b) => sum + (b.balance || 0), 0) || 0;
                totalEl.textContent = '$' + parseFloat(bal).toLocaleString();
            }
            
            if (sourceEl && data) {
                sourceEl.textContent = data.source || (data.mode === 'live' ? 'Live (Coinbase)' : 'Paper Mode');
            }
        }

        function renderSentiment() {
            const container = document.getElementById('sentiment-grid');
            if (!container) return;
            // Placeholder data - coordinate with backend for real sentiment API
            const sentiments = [
                { label: 'BTC', value: 'Bullish', color: 'emerald' },
                { label: 'ETH', value: 'Neutral', color: 'amber' },
                { label: 'Market', value: 'Bullish', color: 'emerald' },
                { label: 'Fear/Greed', value: '42', color: 'amber' }
            ];
            container.innerHTML = sentiments.map(s => `
                <div class="flex justify-between items-center bg-slate-800/50 px-3 py-2 rounded-2xl">
                    <span class="text-slate-400">${s.label}</span>
                    <span class="font-medium text-${s.color}-400">${s.value}</span>
                </div>
            `).join('');
        }

        function renderRebalances() {
            const container = document.getElementById('rebalances-list');
            if (!container) return;
            // Placeholder - coordinate with backend for /api/rebalances
            container.innerHTML = `
                <div class="flex justify-between text-slate-400"><span>BTC-USD</span><span class="text-emerald-400">+2.3%</span></div>
                <div class="flex justify-between text-slate-400"><span>ETH-USD</span><span class="text-red-400">-1.1%</span></div>
            `;
        }

        function renderTrades() {
            const container = document.getElementById('trades-list');
            if (!container) return;
            // Placeholder - coordinate with backend for /api/trades
            container.innerHTML = `
                <div class="flex justify-between"><span class="font-medium">BTC-USD</span> <span class="text-emerald-400">Buy 0.012</span></div>
                <div class="flex justify-between"><span class="font-medium">SOL-USD</span> <span class="text-red-400">Sell 4.5</span></div>
            `;
        }

        function updatePnL() {
            // Placeholder values - coordinate with backend for real P&L endpoints
            const pnls = {
                'pnl-today': '+1.24%',
                'pnl-24h': '+0.87%',
                'pnl-7d': '-2.15%',
                'pnl-30d': '+8.92%',
                'win-ratio': '68%'
            };
            Object.keys(pnls).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = pnls[id];
            });
        }

        async function refreshDashboard() {
            updateTimestamp();

            // Fetch positions (coordinates with backend /api/positions)
            const posData = await fetchData('/api/positions');
            if (posData) {
                renderPositions(posData);
                renderBalance(posData);
                if (posData.mode) updateModeBadge(posData.mode);
            }

            // Also fetch balances for completeness
            const balData = await fetchData('/api/balances');
            if (balData && !posData) {
                renderBalance(balData);
                if (balData.mode) updateModeBadge(balData.mode);
            }

            // Render other sections (placeholders until backend provides endpoints)
            renderSentiment();
            renderRebalances();
            renderTrades();
            updatePnL();
        }

        // Initialize
        function init() {
            initTailwind();
            refreshDashboard();
            
            // Auto-refresh every 30 seconds
            setInterval(refreshDashboard, 30000);
            
            // Keyboard shortcut for manual refresh
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' && e.metaKey) {
                    e.preventDefault();
                    refreshDashboard();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
