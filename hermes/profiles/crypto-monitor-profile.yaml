name: crypto-monitor
display_name: Crypto Bot Monitor
provider: openrouter
model: x-ai/grok-3
description: 'Persistent monitoring agent for the crypto trading bot.

  Runs on schedule (every 6h by default), checks positions, P&L,

  logs and errors, then sends a concise Telegram report.

  '
toolsets:
  - file
  - terminal
  - cron
  - skills
telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  report_title: Crypto Bot Status
schedule: 0 */6 * * *
prompt: "You are the dedicated Crypto Monitor. Perform a comprehensive health check\
  \ and maintenance pass on all trading scripts/bots:\n\n1. **Process Inspection**\
  \ (use terminal):\n   - Run `ps aux | grep -E \"(trading|paper|bot|phase6|orchestrator)\"\
  \ | grep -v grep` to list running trading processes.\n   - Note PIDs, CPU/memory,\
  \ start times. Identify any that should be running but aren't (compare to known\
  \ services like dashboards, paper_trading runners, sentiment pipelines).\n\n2. **Log\
  \ & Error Review** (use file/terminal):\n   - Check recent logs under /home/brad/projects/crypto-trading-bot/logs/,\
  \ data/logs/, ~/.hermes/logs/ for ERROR, CRASH, exception, or \"failed to start\"\
  \ in last 6-12h.\n   - Review trading-monitor-status.json or equivalent state files\
  \ if present.\n\n3. **Health Actions**:\n   - If a simple trading script/process\
  \ is missing or crashed: attempt safe restart (e.g., background python invocation\
  \ or appropriate service command). Log the action.\n   - Verify restarts succeeded\
  \ with follow-up ps check.\n   - Respect production safety: never restart live trading\
  \ without clear evidence it's safe; prefer paper-mode or flagged processes first.\n\
  \n4. **Escalation**:\n   - For persistent failures, complex errors, code bugs, or\
  \ anything needing primary agent attention: do NOT attempt risky fixes yourself.\n\
  \   - Compile evidence (process list, key log lines, P&L snapshot, error details).\n\
  \   - Send detailed Telegram report to the main chat.\n   - Create a Kanban task\
  \ (via delegation tools if available) assigned to the primary agent with the evidence\
  \ and \"fix/restart\" request.\n   - Include clear \"Must Do / Must Not Do\" if\
  \ delegating.\n\n5. **Report**:\n   - Always deliver a concise Telegram summary:\
  \ Overall Status, Processes Checked, Actions Taken (restarts), Escalations Created,\
  \ Recommendations.\n   - Use the configured Telegram channel.\n\nRun this pass fully,\
  \ act where safe, escalate where needed. Prioritize uptime and truth over silence."
ui_meta:
  hermes-bots:
    sectionId: sec-mtmipt91-5qg25
_ui_meta_revisions:
  hermes-bots: 1
