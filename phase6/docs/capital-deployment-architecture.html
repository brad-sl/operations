<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phase 6 — Complete Capital Deployment System (Derivable Workflow)</title>
<style>
body { background:#020617; color:#e2e8f0; font-family:'JetBrains Mono',monospace; margin:0; padding:40px; }
h1 { color:#22d3ee; }
svg { background:#0f172a; border-radius:12px; }
.component { fill:rgba(15,23,42,0.95); stroke:#64748b; stroke-width:1.5; rx:8; }
.arrow { stroke:#64748b; stroke-width:2; }
.label { fill:#e2e8f0; font-size:11px; font-weight:600; }
.sub { fill:#94a3b8; font-size:9px; }
.title { fill:#22d3ee; font-size:13px; font-weight:700; }
</style>
</head>
<body>
<h1>Phase 6 — Complete Capital Deployment Architecture</h1>
<p style="color:#94a3b8">This single diagram contains the full production workflow. Future agents can derive the entire system from it.</p>

<svg width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="820" fill="url(#grid)"/>

  <!-- Row 1: Data Sources -->
  <rect x="40" y="60" width="200" height="80" class="component" stroke="#fbbf24"/>
  <text x="140" y="95" text-anchor="middle" class="title">Coinbase Exchange</text>
  <text x="140" y="115" text-anchor="middle" class="sub">Real balances • fills • liquidations</text>

  <rect x="280" y="60" width="220" height="80" class="component" stroke="#fb7185"/>
  <text x="390" y="95" text-anchor="middle" class="title">Apify + Reddit Scraper</text>
  <text x="390" y="115" text-anchor="middle" class="sub">Native sentiment_score_normalized</text>

  <!-- Row 2: Core State -->
  <rect x="40" y="180" width="240" height="90" class="component" stroke="#34d399"/>
  <text x="160" y="215" text-anchor="middle" class="title">LivePortfolioManager</text>
  <text x="160" y="235" text-anchor="middle" class="sub">get_positions() • reconcile_positions()</text>
  <text x="160" y="252" text-anchor="middle" class="sub">portfolio_state.json + DB</text>

  <rect x="320" y="180" width="240" height="90" class="component" stroke="#a78bfa"/>
  <text x="440" y="215" text-anchor="middle" class="title">Sentiment Pipeline</text>
  <text x="440" y="235" text-anchor="middle" class="sub">score + normalize + cache</text>
  <text x="440" y="252" text-anchor="middle" class="sub">sentiment_cache.json</text>

  <!-- Row 3: Event Layer -->
  <rect x="200" y="320" width="280" height="90" class="component" stroke="#fb923c"/>
  <text x="340" y="355" text-anchor="middle" class="title">RealCapitalEventMonitor</text>
  <text x="340" y="375" text-anchor="middle" class="sub">delta detection → event classification</text>
  <text x="340" y="392" text-anchor="middle" class="sub">(liquidation / deposit / reserve)</text>

  <!-- Row 4: Decision Layer -->
  <rect x="200" y="460" width="280" height="90" class="component" stroke="#22d3ee"/>
  <text x="340" y="495" text-anchor="middle" class="title">CapitalDeploymentRunner</text>
  <text x="340" y="515" text-anchor="middle" class="sub">process_capital_event() only</text>
  <text x="340" y="532" text-anchor="middle" class="sub">Real events + live sentiment only</text>

  <rect x="520" y="460" width="260" height="90" class="component" stroke="#a78bfa"/>
  <text x="650" y="495" text-anchor="middle" class="title">deploy_capital()</text>
  <text x="650" y="515" text-anchor="middle" class="sub">sentiment-weighted allocation</text>
  <text x="650" y="532" text-anchor="middle" class="sub">capital preservation + new pair filter</text>

  <!-- Row 5: Execution -->
  <rect x="200" y="600" width="220" height="80" class="component" stroke="#34d399"/>
  <text x="310" y="635" text-anchor="middle" class="title">Hybrid Rebalancer</text>
  <text x="310" y="655" text-anchor="middle" class="sub">phase5_multi_pair + sentiment</text>

  <rect x="460" y="600" width="220" height="80" class="component" stroke="#fb7185"/>
  <text x="570" y="635" text-anchor="middle" class="title">StopLossCoordinator</text>
  <text x="570" y="655" text-anchor="middle" class="sub">atomic rebalance + SL/TP</text>

  <!-- Row 6: Output -->
  <rect x="200" y="720" width="220" height="70" class="component" stroke="#64748b"/>
  <text x="310" y="755" text-anchor="middle" class="title">Execution Layer</text>
  <text x="310" y="772" text-anchor="middle" class="sub">Paper / Light-Live / Live</text>

  <rect x="460" y="720" width="220" height="70" class="component" stroke="#22d3ee"/>
  <text x="570" y="755" text-anchor="middle" class="title">Dashboard</text>
  <text x="570" y="772" text-anchor="middle" class="sub">real-time events + proposals</text>

  <!-- Arrows (data flow) -->
  <line x1="240" y1="140" x2="160" y2="180" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="140" x2="440" y2="180" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="270" x2="340" y2="320" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="270" x2="340" y2="320" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="410" x2="340" y2="460" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="505" x2="520" y2="505" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="550" x2="310" y2="600" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="550" x2="570" y2="600" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="680" x2="310" y2="720" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="680" x2="570" y2="720" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Legend box -->
  <rect x="820" y="60" width="420" height="680" fill="#0f172a" rx="10"/>
  <text x="840" y="90" class="title">Derivable Workflow (read top→bottom)</text>
  
  <text x="840" y="130" class="label">1. Data Ingestion</text>
  <text x="860" y="148" class="sub">Coinbase → LivePortfolioManager (real balances)</text>
  <text x="860" y="164" class="sub">Apify → Sentiment Pipeline (native scores)</text>

  <text x="840" y="200" class="label">2. Event Detection</text>
  <text x="860" y="218" class="sub">RealCapitalEventMonitor compares snapshots</text>
  <text x="860" y="234" class="sub">Detects real delta → classifies event type</text>

  <text x="840" y="270" class="label">3. Decision</text>
  <text x="860" y="288" class="sub">Runner receives ONLY real events + live sentiment</text>
  <text x="860" y="304" class="sub">Calls deploy_capital (no simulation)</text>

  <text x="840" y="340" class="label">4. Allocation</text>
  <text x="860" y="358" class="sub">deploy_capital applies sentiment weight + filters</text>
  <text x="860" y="374" class="sub">Returns proposed allocations (capital preserved)</text>

  <text x="840" y="410" class="label">5. Execution Path</text>
  <text x="860" y="428" class="sub">Hybrid Rebalancer + StopLossCoordinator</text>
  <text x="860" y="444" class="sub">Atomic rebalance with SL/TP protection</text>

  <text x="840" y="480" class="label">6. Output</text>
  <text x="860" y="498" class="sub">Execution Layer (paper/light-live/live)</text>
  <text x="860" y="514" class="sub">Dashboard shows real-time events &amp; proposals</text>

  <text x="840" y="560" class="label">Strict Rules Enforced</text>
  <text x="860" y="578" class="sub">• No random / simulated events in production path</text>
  <text x="860" y="594" class="sub">• All allocations from live exchange data</text>
  <text x="860" y="610" class="sub">• Sentiment always from pipeline (never hardcoded)</text>
  <text x="860" y="626" class="sub">• Runner is purely reactive (event-driven only)</text>

  <text x="840" y="670" class="label">Audit Status (delegated)</text>
  <text x="860" y="688" class="sub">Clean: runner, deploy_capital, real_monitor</text>
  <text x="860" y="704" class="sub">Flagged: example_*, dry_run_*, test_* files</text>
</svg>
</body>
</html>
