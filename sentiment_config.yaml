# Sentiment Aggregation Configuration
# Supports modular, extensible cryptocurrency sentiment tracking

# Global Configuration
global:
  version: 1.0
  environment: production
  log_level: INFO

# Cryptocurrency Tracking Configuration
cryptocurrencies:
  # Base list of tracked cryptocurrencies
  default_tracked:
    - symbol: BTC
      name: Bitcoin
      tracking_priority: high
    - symbol: ETH
      name: Ethereum
      tracking_priority: high
    - symbol: XRP
      name: Ripple
      tracking_priority: medium
  
  # Extensible list for future additions
  additional_tracked: []

# Sentiment Source Configuration
sentiment_sources:
  x_api:
    enabled: true
    weight: 0.7
    endpoint: https://api.twitter.com/2/tweets/search/recent
  
  news_api:
    enabled: true
    weight: 0.3
    endpoint: https://newsapi.org/v2/everything

# Scalability and Distribution Considerations
distributed:
  # Placeholder for future distributed processing configuration
  enabled: false
  worker_nodes: []

# Monitoring and Observability
monitoring:
  # Future extensibility for comprehensive monitoring
  metrics_endpoint: null
  alert_thresholds:
    sentiment_divergence: 0.5
    data_completeness: 0.8

# Platform-Agnostic Design Principles
design_principles:
  - modular_architecture
  - horizontal_scalability
  - platform_independence
  - real_time_adaptability