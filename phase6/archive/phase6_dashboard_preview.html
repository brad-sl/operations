<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 6 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-7xl mx-auto p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight">Phase 6 Dashboard</h1>
                <div class="flex items-center gap-3 mt-1">
                    <span id="mode-badge" class="px-3 py-0.5 text-xs rounded-2xl bg-emerald-900 text-emerald-400 font-medium">PAPER</span>
                    <span class="text-slate-500 text-sm">Last updated: <span id="last-updated">--</span></span>
                </div>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-400">Total Portfolio Value</div>
                <div id="total-balance" class="text-4xl font-semibold tabular-nums">$0.00</div>
                <div id="balance-source" class="text-xs text-slate-500"></div>
            </div>
        </div>

        <!-- KPI Row -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <div class="text-slate-400 text-sm">Today</div>
                <div id="pnl-today" class="text-2xl font-semibold mt-1">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <div class="text-slate-400 text-sm">24 Hours</div>
                <div id="pnl-24h" class="text-2xl font-semibold mt-1">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <div class="text-slate-400 text-sm">7 Days</div>
                <div id="pnl-7d" class="text-2xl font-semibold mt-1">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <div class="text-slate-400 text-sm">30 Days</div>
                <div id="pnl-30d" class="text-2xl font-semibold mt-1">+0.00%</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <div class="text-slate-400 text-sm">Win Ratio</div>
                <div id="win-ratio" class="text-2xl font-semibold mt-1">--</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Active Positions -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold flex items-center gap-2"><i class="fa-solid fa-wallet"></i> Active Positions</h2>
                    <span id="position-count" class="text-xs px-3 py-1 bg-slate-800 rounded-2xl">0 pairs</span>
                </div>
                <div id="positions-table" class="overflow-auto"></div>
            </div>

            <!-- Sentiment -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-globe"></i> Sentiment</h2>
                <div id="sentiment-grid" class="grid grid-cols-2 gap-3 text-sm"></div>
            </div>

            <!-- Recent Rebalances -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-sync"></i> Recent Rebalances</h2>
                <div id="rebalances-list" class="space-y-3 text-sm"></div>
            </div>

            <!-- Recent Trades -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i class="fa-solid fa-exchange-alt"></i> Recent Trades</h2>
                <div id="trades-list" class="space-y-3 text-sm"></div>
            </div>

        </div>
    </div>
</body>
</html>
